name: 构建 Windows 版本（手动触发）

# 手动触发：仓库页面 Actions → 左侧 "构建 Windows 版本" → Run workflow
on:
  workflow_dispatch:
    inputs:
      ffmpeg_build:
        description: FFmpeg 构建来源（gyan.dev）
        type: choice
        default: release-essentials
        options:
          - release-essentials   # 最新稳定版（推荐）
          - git-essentials       # 每日 git 构建（最新）
      build_mode:
        description: 打包模式
        type: choice
        default: onefile
        options:
          - onefile              # 单个 exe（含 ffmpeg，单文件分发）
          - onedir               # 目录 + zip
      python_version:
        description: Python 版本（Windows 7 兼容必须为 3.9，3.10+ 不再支持 Win7）
        type: choice
        default: '3.9'
        options:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
      create_release:
        description: 同时创建 GitHub Release 草稿
        type: boolean
        default: false

jobs:
  build-windows:
    name: Windows 构建 (py${{ inputs.python_version }} / ${{ inputs.build_mode }})
    runs-on: windows-latest
    permissions:
      contents: write   # 供 Release 草稿使用

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: 安装依赖（清华镜像）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller `
            -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn

      - name: 运行单元测试
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: 下载最新 ffmpeg 并打包（含内置 ffmpeg 的单文件 exe）
        shell: pwsh
        run: |
          ./build/package_windows.ps1 `
            -FfmpegSource ${{ inputs.ffmpeg_build }} `
            -BuildMode ${{ inputs.build_mode }} `
            -Py python

      - name: 冒烟启动 exe（验证可运行）
        if: inputs.build_mode == 'onefile'
        shell: pwsh
        run: |
          $exe = "dist\IPodConverter.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 45   # onefile 首次启动需解压内置资源（含 ffmpeg）
            if ($p.HasExited) { throw "exe 启动后异常退出，退出码 $($p.ExitCode)" }
            Write-Host "exe 冒烟启动通过（PID $($p.Id)）"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: IPodConverter-windows-${{ inputs.build_mode }}-py${{ inputs.python_version }}
          path: dist/*
          if-no-files-found: error

      - name: 创建 GitHub Release 草稿（可选）
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: IPodConverter Windows ${{ inputs.build_mode }} (py${{ inputs.python_version }})
          tag_name: windows-${{ inputs.build_mode }}-${{ github.run_number }}
          body: |
            ## 构建信息
            - Python：${{ inputs.python_version }}（Windows 7 兼容）
            - FFmpeg：gyan.dev ${{ inputs.ffmpeg_build }}（最新，已内置）
            - 打包模式：${{ inputs.build_mode }}

            ## Windows 7 说明
            - 需要 Windows 7 SP1 + UCRT（KB2999226）——Python 3.9 运行时
              与内置 ffmpeg 的共同前置条件
            - mgg/mflac 解密依赖 frida 与 QQMusic.exe 进程
          files: dist/*
